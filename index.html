<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South of the Park — Lower &amp; Midtown Manhattan, 4–6 September 2026</title>
<style>
:root{
  --ink:#12161c;
  --ink-2:#2b323c;
  --paper:#e5e8e3;
  --card:#ffffff;
  --rule:#c6cbc4;
  --muted:#5c6470;
  --line-red:#ee352e;
  --line-green:#00933c;
  --line-blue:#0039a6;
  --line-orange:#ff6319;
  --line-brown:#996633;
  --line-yellow:#fccc0a;
  --line-purple:#b933ad;
  --line-lime:#6cbe45;
  --line-grey:#8d9199;
  --water:#d3dbe0;
  --land:#dcded7;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.58;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- signage header ---------- */
.signage{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;}
.signage-top{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:11px 20px 9px;border-bottom:1px solid #262c36;
}
.mark{
  font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.14em;
  text-transform:uppercase;
}
.mark span{display:inline-block;background:#fff;color:var(--ink);padding:2px 7px 1px;margin-right:2px;}
.dateline{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#9aa3ae;
  text-transform:uppercase;
}
.dateline b{color:#fff;font-weight:400}
nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;background:none;border:0;cursor:pointer;color:#a9b1bb;
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:12px 15px 11px;display:flex;align-items:center;gap:8px;
  border-bottom:4px solid transparent;transition:color .12s;white-space:nowrap;
}
nav button:hover{color:#fff}
nav button .bul{
  width:17px;height:17px;border-radius:50%;background:var(--c);display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;letter-spacing:0;flex:0 0 auto;
}
nav button[data-c="yellow"] .bul,nav button[data-c="lime"] .bul{color:#12161c}
nav button[aria-current="true"]{color:#fff;border-bottom-color:var(--c)}
.railbar{height:6px;background:var(--c,#888)}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:0 20px 100px}
.card{display:none;padding-top:34px}
.card.on{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;
}
h1{
  font-family:var(--sans);font-weight:700;letter-spacing:-.025em;line-height:1.02;
  font-size:clamp(34px,6.4vw,58px);margin:0 0 6px;display:flex;align-items:center;gap:14px;
}
h1 .bul{
  width:.62em;height:.62em;border-radius:50%;background:var(--c);flex:0 0 auto;
}
.sub{font-size:20px;line-height:1.45;color:var(--ink-2);max-width:62ch;margin:0 0 26px}
h2{
  font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:.13em;text-transform:uppercase;
  margin:44px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink);
}
h2:first-of-type{margin-top:34px}
h2 em{font-style:normal;color:var(--muted);letter-spacing:.06em;text-transform:none;font-weight:400;font-family:var(--serif);font-size:15px;float:right;}
h3{font-family:var(--sans);font-size:17px;letter-spacing:-.01em;margin:26px 0 6px}
p{margin:0 0 14px;max-width:70ch}
.lede{font-size:18.5px}
small,.small{font-size:14px}

/* ---------- station list (signature) ---------- */
.line{list-style:none;margin:18px 0 0;padding:0 0 0 34px;position:relative}
.line::before{
  content:"";position:absolute;left:8px;top:12px;bottom:12px;width:5px;
  background:var(--c);border-radius:3px;
}
.stop{position:relative;margin:0 0 12px}
.stop::before{
  content:"";position:absolute;left:-31px;top:19px;width:15px;height:15px;border-radius:50%;
  background:var(--card);border:4px solid var(--c);
}
.stop.term::before{border-radius:2px}
.box{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:14px 16px 13px;
}
.stop .box{border-left:3px solid var(--c)}
.nm{
  font-family:var(--sans);font-weight:700;font-size:17.5px;letter-spacing:-.012em;
  margin:0 0 2px;display:block;
}
.meta{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);
  margin:0 0 8px;text-transform:uppercase;
}
.meta .hood{color:var(--ink);font-weight:600}
.box p{margin:0 0 8px;font-size:16px;line-height:1.5}
.box p:last-child{margin-bottom:0}
.flag{
  display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 7px 2px;border-radius:2px;
  margin:0 5px 5px 0;background:var(--ink);color:#fff;vertical-align:2px;
}
.flag.warn{background:var(--line-red)}
.flag.ok{background:var(--line-green)}
.flag.cash{background:var(--line-yellow);color:var(--ink)}
.flag.free{background:var(--line-blue)}
.tip{font-size:15px;color:var(--ink-2);border-top:1px dotted var(--rule);padding-top:8px;margin-top:9px}
.tip b{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.links{margin-top:9px;font-family:var(--sans);font-size:12.5px;letter-spacing:.02em}
.links a{
  display:inline-block;margin:0 14px 4px 0;text-decoration:none;
  border-bottom:2px solid var(--c);padding-bottom:1px;font-weight:600;
}
.links a:hover{background:var(--c);color:#fff;border-color:transparent}

/* ---------- filter chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
.chip{
  border:1.5px solid var(--ink);background:none;border-radius:20px;cursor:pointer;
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding:5px 13px 4px;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);margin:10px 0 0;letter-spacing:.05em}

/* ---------- panels ---------- */
.panel{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:18px 20px;margin:20px 0;max-width:840px;
}
.panel.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel.dark h3{color:#fff;margin-top:0}
.panel.dark a{color:#fff}
.panel.rule{border-left:5px solid var(--c)}
.panel h3:first-child{margin-top:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));margin:18px 0}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:14px 15px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.stat .v{font-family:var(--sans);font-weight:700;font-size:21px;letter-spacing:-.02em;display:block;line-height:1.15}
.stat .n{font-size:14.5px;color:var(--ink-2);display:block;margin-top:5px;line-height:1.4}

/* ---------- day columns ---------- */
.days{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:20px 0}
.day{background:var(--card);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.day header{background:var(--ink);color:#fff;padding:11px 15px 9px}
.day header .d{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:-.02em}
.day header .w{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9aa3ae}
.day ul{list-style:none;margin:0;padding:6px 15px 15px}
.day li{padding:9px 0;border-bottom:1px dotted var(--rule);font-size:15.5px;line-height:1.45}
.day li:last-child{border-bottom:0}
.day li .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);display:block}
.day li b{font-family:var(--sans);font-size:15.5px;letter-spacing:-.005em}

/* ---------- map ---------- */
.mapwrap{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px;margin:18px 0}
#svgmap{width:100%;height:auto;display:block;touch-action:pan-y}
#svgmap text{font-family:var(--sans);pointer-events:none}
.hood-label{paint-order:stroke;stroke:#fbfbf9;stroke-width:3.5px;stroke-linejoin:round}
.mk{cursor:pointer}
.mk circle{stroke:#fff;stroke-width:2}
.mk:hover circle,.mk:focus circle{stroke:var(--ink);stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lg{
  display:flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:none;
  border-radius:20px;cursor:pointer;padding:4px 12px 3px;
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
}
.lg i{width:11px;height:11px;border-radius:50%;background:var(--k);display:block}
.lg[aria-pressed="false"]{opacity:.34}
#mapinfo{
  min-height:74px;border-top:2px solid var(--ink);margin-top:10px;padding-top:11px;
  font-size:15.5px;line-height:1.45;
}
#mapinfo .nm{font-size:17px}
#mapinfo .meta{margin-bottom:6px}

/* ---------- misc ---------- */
.jump{
  background:none;border:0;border-bottom:2px solid var(--ink);cursor:pointer;padding:0 0 1px;
  font-family:var(--sans);font-weight:700;font-size:.92em;letter-spacing:.01em;
}
.jump:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:15.5px;background:var(--card)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:#fff;border-bottom:0}
td:first-child{font-family:var(--sans);font-weight:700;font-size:15px;white-space:nowrap}
footer{
  border-top:2px solid var(--ink);margin-top:60px;padding:18px 0 0;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);
}
:focus-visible{outline:3px solid var(--line-blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media (max-width:620px){
  body{font-size:16px}
  main{padding:0 14px 80px}
  .line{padding-left:28px}
  .line::before{left:5px}
  .stop::before{left:-27px;width:13px;height:13px;border-width:3.5px}
  h2 em{float:none;display:block;margin-top:4px}
}
</style>
</head>

 f:['free|Free'],
 tip:'This weekend the sidewalks just east of the park host the Washington Square Outdoor Art Exhibit — see <span class="jumpref" data-go="weekend">This Weekend</span>.'},

{s:'see',t:['Free','History'],n:'Stonewall National Monument',h:'West Village',a:'Christopher Park, 51–53 Christopher St',lat:40.7338,lng:-74.0021,
 o:'Park daylight hours; the bar keeps its own hours',
 d:'The first US national monument to LGBTQ history: a small triangular park, George Segal\u2019s white sculptures, and the bar opposite where the June 1969 uprising began.',
 f:['free|Free']},

{s:'see',t:['Walk','Free','Icon'],n:'The High Line',h:'Chelsea / Meatpacking',a:'Gansevoort St to W 34th St',lat:40.7395,lng:-74.0080,
 o:'Roughly 07:00–22:00 in September',
 d:'An elevated freight line replanted by Piet Oudolf as a mile-and-a-half of prairie above the West Side. Late summer is when the grasses look best.',
 f:['free|Free'],
 tip:'Enter at Gansevoort (south end, next to the Whitney) and walk north. It is one-way-ish and jammed between 12:00 and 17:00; go at 08:00 or after 19:00.'},

{s:'see',t:['Park','Free','Waterfront'],n:'Little Island',h:'Hudson River Park',a:'Pier 55 at W 13th St',lat:40.7419,lng:-74.0106,
 o:'Park roughly 06:00–23:00; free entry',
 d:'Thomas Heatherwick\u2019s park on 132 concrete tulips, floating over the wreck of Pier 54 — where the <i>Carpathia</i> landed the Titanic survivors in 1912.',
 f:['free|Free'],
 tip:'The 2026 performance season ends on Sunday 6 September. Both the free 17:00 shows and the $25 evening shows run all three of your days — see <span class="jumpref" data-go="weekend">This Weekend</span>.',
 l:[['littleisland.org','https://littleisland.org/']]},

{s:'see',t:['Museum','Art'],n:'Whitney Museum of American Art',h:'Meatpacking District',a:'99 Gansevoort St',lat:40.7396,lng:-74.0089,
 o:'Closed Tuesdays; typically 10:30–18:00, Fridays late',
 d:'Renzo Piano\u2019s asymmetric hull at the foot of the High Line, with outdoor terraces stepping down toward the river. American art from 1900 to this morning.',
 tip:'On now: the <b>Whitney Biennial 2026</b> (to 12 Oct), <b>Andy Warhol Family Album</b> (to 19 Oct) and <b>Minnie Evans</b> (to 10 Jan). <b>Roy Lichtenstein: 1997</b> opens Saturday 5 September.',
 l:[['whitney.org','https://whitney.org/']]},

{s:'see',t:['Market','Food'],n:'Chelsea Market',h:'Chelsea',a:'75 Ninth Ave',lat:40.7424,lng:-74.0061,
 o:'Roughly 07:00–22:00',
 d:'The old Nabisco factory where the Oreo was invented, now a brick-and-pipe food concourse. Touristy, genuinely good at the edges.',
 tip:'Los Tacos No. 1, Very Fresh Noodles and the Lobster Place are the reasons to come. Go at 11:00 or 15:00, never at 13:00.'},

{s:'see',t:['Art','Free'],n:'Chelsea gallery district',h:'Chelsea',a:'W 19th–27th Sts, between Tenth & Eleventh Aves',lat:40.7480,lng:-74.0055,
 o:'Most galleries Tue–Sat 10:00–18:00; closed Sun & Mon',
 d:'Several hundred commercial galleries in a twenty-block grid. Free, no appointment, walk in off the street.',
 f:['free|Free','warn|Awkward timing'],
 tip:'The autumn season opens 10–11 September, a few days after you leave, so this weekend Chelsea is quiet and many spaces are between shows. Dia Chelsea and Pace stay open and are worth the walk regardless.'},

{s:'see',t:['Art','Free'],n:'Dia Chelsea',h:'Chelsea',a:'537 W 22nd St',lat:40.7476,lng:-74.0056,
 o:'Typically Wed–Sun; free admission',
 d:'Dia\u2019s Manhattan space, currently showing <b>David Lamelas: The Machine</b>, a full survey of the Argentine conceptualist, through mid-January.',
 f:['free|Free']},

{s:'see',t:['View','Ticketed'],n:'Edge & The Vessel, Hudson Yards',h:'Hudson Yards',a:'20 Hudson Yards, 30th St at Tenth Ave',lat:40.7538,lng:-74.0021,
 o:'Edge roughly 10:00–22:00',
 d:'The highest open-air deck in the Western Hemisphere, cantilevered 80 feet out with a glass floor panel. Below it, Heatherwick\u2019s copper stair-sculpture, reopened with new safety netting.',
 tip:'City Climb — harnessed, up the outside of the building — leaves from the same lobby if the deck is not enough.'},

{s:'see',t:['Art','Ticketed'],n:'The Shed',h:'Hudson Yards',a:'545 W 30th St',lat:40.7546,lng:-74.0021,
 o:'Varies by programme',
 d:'A cultural centre with a telescoping shell that rolls out over the plaza on rails. Programming swings from Björk to Broadway try-outs.',
 tip:'<b>The Black Mirror Experience</b> closes Sunday 6 September — your last chance. <b>Doug Aitken: Lightscape</b>, a free seven-screen installation, runs to 13 September.'},

{s:'see',t:['Park','Free'],n:'Madison Square Park',h:'Flatiron',a:'Fifth Ave at E 23rd St',lat:40.7411,lng:-73.9897,
 o:'06:00–23:00',
 d:'The best place to stand and look at the Flatiron Building, plus a rotating public art commission, a dog run with a social hierarchy, and the original Shake Shack kiosk.',
 f:['free|Free']},

{s:'see',t:['Market','Food','Free'],n:'Union Square Greenmarket',h:'Union Square',a:'E 17th St at Broadway',lat:40.7359,lng:-73.9911,
 o:'Mon, Wed, Fri, Sat 08:00–18:00',
 d:'The city\u2019s flagship farmers\u2019 market, running since 1976. Early September is peak tomato, corn and peach.',
 f:['free|Free'],
 tip:'Saturday is the big day — around 140 stalls. It is a market, not an attraction, which is exactly why it is worth an hour.'},

{s:'see',t:['View','Icon','Ticketed'],n:'Empire State Building',h:'Midtown South',a:'20 W 34th St',lat:40.7484,lng:-73.9857,
 o:'Roughly 09:00–24:00, last elevator 23:15',
 d:'1931, 102 storeys, and still the building the city is named after in everyone\u2019s head. The 86th-floor deck is open-air; the 102nd is glassed and costs more.',
 tip:'Late slots (after 22:00) are the least crowded and the city looks better lit. The second-floor museum exhibit before the lift is unexpectedly good.'},

{s:'see',t:['Museum','Art'],n:'The Morgan Library & Museum',h:'Murray Hill',a:'225 Madison Ave',lat:40.7492,lng:-73.9814,
 o:'Closed Mondays; typically Tue–Sun 10:30–17:00, Fri late',
 d:'J. P. Morgan\u2019s private library — three tiers of walnut bookcases, a Gutenberg Bible, a painted ceiling — wrapped in a Renzo Piano court.',
 tip:'On now: <b>Tarot! Renaissance Symbols, Modern Visions</b> (to 4 Oct), <b>Hujar: Contact</b> (to 25 Oct), and the Dunlap broadside of the Declaration of Independence (to 13 Sep).',
 l:[['themorgan.org','https://www.themorgan.org/']]},

{s:'see',t:['Free','Architecture'],n:'New York Public Library, Schwarzman Building',h:'Midtown',a:'476 Fifth Ave at 42nd St',lat:40.7532,lng:-73.9822,
 o:'Typically Mon–Sat from 10:00, Sunday afternoons; check holiday hours',
 d:'Patience and Fortitude on the steps, the Rose Main Reading Room upstairs, and the free Polonsky Exhibition downstairs with a Gutenberg Bible, Jefferson\u2019s handwritten Declaration and the original Winnie-the-Pooh toys.',
 f:['free|Free']},

{s:'see',t:['Park','Free'],n:'Bryant Park',h:'Midtown',a:'Sixth Ave between 40th & 42nd Sts',lat:40.7536,lng:-73.9832,
 o:'Roughly 07:00–22:00',
 d:'A formal lawn behind the library with free chairs, a carousel, ping-pong, a reading room and the best public toilets in New York — a claim the park itself makes.',
 f:['free|Free']},

{s:'see',t:['Free','Architecture','Icon'],n:'Grand Central Terminal',h:'Midtown East',a:'89 E 42nd St',lat:40.7527,lng:-73.9772,
 o:'Roughly 05:15–02:00',
 d:'1913, and the reason America has a historic-preservation movement. The ceiling\u2019s zodiac is painted backwards; the Whispering Gallery outside the Oyster Bar works exactly as advertised.',
 f:['free|Free'],
 tip:'Stand on the west balcony stairs for the shot. Then go downstairs and eat something — the dining concourse is far better than a train station deserves.'},

{s:'see',t:['View','Ticketed'],n:'SUMMIT One Vanderbilt',h:'Midtown East',a:'45 E 42nd St',lat:40.7527,lng:-73.9787,
 o:'Roughly 09:00–22:00',
 d:'Less an observation deck than a mirrored art installation you happen to be 1,000 feet up inside. Includes Ascent, a glass lift on the outside of the building.',
 tip:'Wear something you don\u2019t mind seeing reflected upward. Skirts and the mirrored floor are a known problem.'},

{s:'see',t:['Free','Architecture'],n:'Chrysler Building lobby',h:'Midtown East',a:'405 Lexington Ave',lat:40.7516,lng:-73.9755,
 o:'Weekday business hours only',
 d:'The finest Art Deco interior in the city: red Moroccan marble, chrome, and an Edward Trumbull ceiling mural of aeroplanes and the building itself. No observation deck — it closed in 1945.',
 f:['free|Free','warn|Weekdays']},

{s:'see',t:['Icon','Free'],n:'Times Square & the TKTS booth',h:'Theater District',a:'Broadway at W 47th St',lat:40.7580,lng:-73.9855,
 o:'Always; TKTS from roughly 15:00 for evening shows',
 d:'Around 350,000 people cross it every day and almost none of them live here. Go once, at night, look up, then leave. The red steps hide the discount theatre booth underneath.',
 f:['free|Free'],
 tip:'Do not eat in Times Square. Walk four blocks west into Hell\u2019s Kitchen or four blocks east and you are in a different city.'},

{s:'see',t:['Theatre','Ticketed'],n:'The Broadway theatres',h:'Theater District',a:'41st–54th Sts between Sixth & Ninth Aves',lat:40.7590,lng:-73.9870,
 o:'Evenings 19:00 or 20:00; matinees Wed, Sat, Sun',
 d:'Forty-one houses inside half a square mile. On this weekend the board runs from <i>Hamilton</i>, <i>Wicked</i>, <i>The Lion King</i> and <i>MJ</i> to <i>Stranger Things: The First Shadow</i>, <i>Buena Vista Social Club</i>, <i>Maybe Happy Ending</i>, <i>Just In Time</i>, <i>Schmigadoon!</i> and a new <i>Rocky Horror Show</i>.',
 f:['warn|Book ahead'],
 tip:'Broadway Week (two-for-one tickets) starts 8 September — two days after you leave. For this weekend use TodayTix rush, digital lotteries, or the TKTS booth for same-day seats.',
 l:[['TKTS at Times Square','https://www.tdf.org/tkts/']]},

{s:'see',t:['View','Icon','Ticketed'],n:'Top of the Rock',h:'Midtown',a:'45 Rockefeller Plaza',lat:40.7587,lng:-73.9787,
 o:'Roughly 09:00–24:00',
 d:'Three open decks on the 67th–70th floors of 30 Rock, plus the newer Beam (you sit on a girder, <i>that</i> girder) and Skylift.',
 tip:'The best skyline deck in the city, because it is the only one with the Empire State Building in front of you and Central Park behind. Book the slot around sunset — roughly 19:15 this weekend.'},

{s:'see',t:['Free','Architecture'],n:'St. Patrick\u2019s Cathedral',h:'Midtown',a:'Fifth Ave at E 50th St',lat:40.7585,lng:-73.9760,
 o:'Roughly 06:30–20:45',
 d:'A white marble Gothic Revival cathedral marooned among skyscrapers, finished in 1878 when this was still farmland at the city\u2019s edge.',
 f:['free|Free']},

{s:'see',t:['Museum','Art'],n:'Museum of Modern Art (MoMA)',h:'Midtown',a:'11 W 53rd St',lat:40.7614,lng:-73.9776,
 o:'Daily, roughly 10:30–17:30; Fridays to 20:00',
 d:'<i>The Starry Night</i>, <i>Les Demoiselles d\u2019Avignon</i>, Monet\u2019s <i>Water Lilies</i> room, and the sculpture garden — the most concentrated hour of 20th-century art anywhere.',
 f:['warn|Very busy'],
 tip:'On now: <b>Frida and Diego: The Last Dream</b> (closes 12 Sep), <b>Architects of Liberation: Modernism in Western Africa</b>, and <b>Pierre Huyghe: UUmwelt</b> in the sculpture garden. Book the first slot of the day; by noon the fifth floor is shoulder-to-shoulder.',
 l:[['moma.org','https://www.moma.org/']]},

{s:'see',t:['Museum','Family'],n:'Intrepid Museum',h:'Hell\u2019s Kitchen',a:'Pier 86, W 46th St at Twelfth Ave',lat:40.7645,lng:-74.0000,
 o:'Roughly 10:00–17:00, last entry 16:00',
 d:'A WWII aircraft carrier with the space shuttle <i>Enterprise</i> on the flight deck, a Concorde on the pier and a Cold War submarine alongside.'},

{s:'see',t:['Free','Transit','View'],n:'Roosevelt Island Tramway',h:'Midtown East',a:'E 59th St at Second Ave',lat:40.7614,lng:-73.9640,
 o:'Roughly 06:00–02:00, every 7–15 min',
 d:'An aerial cable car across the East River for the price of a subway ride. Four minutes each way, 250 feet up, alongside the Queensboro Bridge.',
 tip:'Pay with OMNY or a MetroCard — it is a regular fare, and there is a free transfer to the subway. The best cheap thrill in the city.'},

{s:'see',t:['Waterfront','Free','Walk'],n:'Hudson River Park Greenway',h:'West Side',a:'Battery Park to W 59th St',lat:40.7300,lng:-74.0113,
 o:'Always',
 d:'A continuous car-free path along the whole west side — the busiest bike path in the United States. Piers along the way have skate parks, mini golf, beach volleyball and a trapeze school.',
 f:['free|Free'],
 tip:'Citi Bike from Battery Park to Little Island takes about 25 minutes and is the single best way to understand how the island is put together.'},

{s:'see',t:['Museum','History'],n:'Museum of Chinese in America',h:'Chinatown',a:'215 Centre St',lat:40.7192,lng:-74.0000,
 o:'Closed Mon–Tue; typically Wed–Sun',
 d:'A Maya Lin–designed space telling 160 years of Chinese American history, from the gold rush through the Exclusion Act to now.'},

/* ---------------- EAT ---------------- */
{s:'eat',t:['Book now','Italian'],n:'Carbone',h:'Greenwich Village',a:'181 Thompson St',lat:40.7280,lng:-74.0007,
 o:'Dinner nightly; lunch selected days',
 d:'Italian-American theatre — tuxedoed captains, tableside Caesar, and the spicy rigatoni vodka that launched a thousand imitations. Also veal parmesan the size of a hubcap.',
 f:['warn|30 days, 10:00'],
 tip:'Reservations drop on Resy 30 days ahead at 10:00 ET exactly. Failing that, the bar takes walk-ins and serves the full menu — queue from about 17:00.'},

{s:'eat',t:['Book now','Italian'],n:'Torrisi',h:'Nolita',a:'275 Mulberry St, in the Puck Building',lat:40.7247,lng:-73.9950,
 o:'Dinner nightly; lunch is easier',
 d:'Rich Torrisi\u2019s Italian-American cooking filtered through the neighbourhood\u2019s Chinese, Jewish and Puerto Rican history. More interesting food than its more famous sibling.',
 f:['warn|30 days, 10:00'],
 tip:'The 12-seat bar serves the full menu on a first-come basis — turn up around 16:15. Lunch reservations are noticeably easier than dinner.'},

{s:'eat',t:['Book now','Steak'],n:'4 Charles Prime Rib',h:'West Village',a:'4 Charles St',lat:40.7357,lng:-74.0026,
 o:'Dinner nightly',
 d:'A dark 40-seat basement doing prime rib, a French dip, and a burger people organise their month around. The hardest ordinary-sized reservation in the city.',
 f:['warn|Near-impossible'],
 tip:'Assume you will not get a table. Try the bar at opening on a weeknight, or set a Resy notify and accept whatever time appears.'},

{s:'eat',t:['Book now','Indian'],n:'Semma',h:'West Village',a:'60 Greenwich Ave',lat:40.7365,lng:-74.0010,
 o:'Dinner nightly',
 d:'South Indian cooking with no apology and no anglicising: gunpowder dosa, whole goat biryani, oxtail with pepper. Widely argued to be the best restaurant in New York right now.',
 f:['warn|Book far ahead'],
 tip:'If Semma is gone, its sibling Dhamaka on Delancey Street runs the same philosophy for other Indian regions, and is fractionally easier.'},

{s:'eat',t:['Book now','American'],n:'The Polo Bar',h:'Midtown',a:'1 E 55th St',lat:40.7614,lng:-73.9748,
 o:'Dinner Tue–Sat, roughly',
 d:'Ralph Lauren\u2019s clubhouse: saddle leather, equestrian oil paintings, a corned beef sandwich, and a room full of people pretending not to look at each other.',
 f:['warn|Phone only','warn|Jacket'],
 tip:'Not on any app. Call 212-207-8562 the moment the reservations office opens at 10:00, exactly one month ahead by calendar date. Same-day calls just before service sometimes land.'},

{s:'eat',t:['Book now','Korean'],n:'COQODAQ',h:'Flatiron',a:'13 E 22nd St',lat:40.7401,lng:-73.9887,
 o:'Dinner nightly',
 d:'A cathedral to Korean fried chicken with a 1,000-bottle champagne list and a hand-towel ritual. From the Atomix team, which is why it is not a novelty.',
 f:['warn|13 days, 10:00'],
 tip:'The booking window is only 13 days — shorter than most, so people miss it. Set an alarm for 10:00 on 22 or 23 August equivalent for your dates.'},

{s:'eat',t:['Book now','Tasting'],n:'Eleven Madison Park',h:'Flatiron',a:'11 Madison Ave',lat:40.7415,lng:-73.9873,
 o:'Dinner; limited lunches',
 d:'Three Michelin stars, an Art Deco room over Madison Square Park, and an entirely plant-based tasting menu since 2021. Divisive, technically extraordinary.',
 f:['warn|Weeks ahead']},

{s:'eat',t:['Book now','Seafood','Tasting'],n:'Le Bernardin',h:'Midtown',a:'155 W 51st St',lat:40.7617,lng:-73.9819,
 o:'Lunch Mon–Fri, dinner Mon–Sat',
 d:'Eric Ripert\u2019s seafood restaurant has held three stars since 2005 and is the closest thing New York has to a fixed point. The menu is organised as Almost Raw / Barely Touched / Lightly Cooked.',
 f:['warn|30 days'],
 tip:'Weekday lunch is the way in: same kitchen, far easier booking, roughly half the money.'},

{s:'eat',t:['Book now','Korean','Tasting'],n:'Jungsik',h:'Tribeca',a:'2 Harrison St',lat:40.7195,lng:-74.0090,
 o:'Dinner Tue–Sat, roughly',
 d:'The first Korean restaurant in the United States to hold three Michelin stars. Korean flavours through French technique in a quiet Tribeca corner building.',
 f:['warn|Book ahead']},

{s:'eat',t:['Book now','Korean','Tasting'],n:'Atomix',h:'NoMad',a:'104 E 30th St',lat:40.7442,lng:-73.9829,
 o:'Dinner, counter seatings',
 d:'Junghyun Park\u2019s 14-seat counter, where each course arrives with a printed card explaining the ingredient. Two stars and the most thoughtful meal in the city.',
 f:['warn|Book ahead']},

{s:'eat',t:['Book now','Korean','Steak'],n:'COTE Korean Steakhouse',h:'Flatiron',a:'16 W 22nd St',lat:40.7411,lng:-73.9917,
 o:'Lunch and dinner daily',
 d:'Korean barbecue crossed with an American steakhouse, dry-aging room in the window. Order the Butcher\u2019s Feast and let them run it.',
 f:['warn|Book ahead']},

{s:'eat',t:['Book now','Indian'],n:'Dhamaka',h:'Lower East Side',a:'119 Delancey St, in Essex Market',lat:40.7186,lng:-73.9877,
 o:'Lunch and dinner daily',
 d:'Regional Indian cooking that most Indian restaurants will not attempt — goat neck, champaran meat, doh khleh. Loud, red, and completely uncompromising.',
 f:['warn|Book ahead']},

{s:'eat',t:['Book now','Italian'],n:'Don Angie',h:'West Village',a:'103 Greenwich Ave',lat:40.7386,lng:-74.0025,
 o:'Dinner nightly',
 d:'Italian-American reinvented rather than restored: the chrysanthemum-shaped pinwheel lasagna, lasagna for two, and a room the size of a living room.',
 f:['warn|30 days, 10:00']},

{s:'eat',t:['Book now','Italian'],n:'Rezd\u00f4ra',h:'Flatiron',a:'27 E 20th St',lat:40.7386,lng:-73.9884,
 o:'Dinner nightly',
 d:'Stefano Secchi cooks Emilia-Romagna: tortellini in brodo, the "Nonna\u2019s Aged Parmesan" tasting. Hand-rolled pasta at a level almost nowhere else in the city reaches.',
 f:['warn|Book ahead']},

{s:'eat',t:['Bookable','French'],n:'Balthazar',h:'SoHo',a:'80 Spring St',lat:40.7226,lng:-73.9983,
 o:'Breakfast through late dinner, daily',
 d:'Keith McNally\u2019s Parisian brasserie, aged mirrors and all, running since 1997 and still the best-looking room in SoHo.',
 tip:'Dinner needs booking; breakfast at 08:00 does not, and is the sleeper meal — pastries, eggs, the whole room to yourself.'},

{s:'eat',t:['Bookable','French'],n:'Frenchette',h:'Tribeca',a:'241 W Broadway',lat:40.7192,lng:-74.0060,
 o:'Dinner Tue–Sat, roughly',
 d:'From the pair who ran Balthazar\u2019s kitchens: duck frites, a serious natural wine list, and bentwood chairs under a curved ceiling.'},

{s:'eat',t:['Bookable','French'],n:'Le Coucou',h:'SoHo',a:'138 Lafayette St',lat:40.7192,lng:-73.9989,
 o:'Dinner nightly; weekend lunch',
 d:'High French with the frills intact — quenelle de brochet, tout le lapin — in a candlelit room by Roman & Williams.'},

{s:'eat',t:['Walk in','American'],n:'Gramercy Tavern',h:'Flatiron',a:'42 E 20th St',lat:40.7387,lng:-73.9882,
 o:'Lunch and dinner daily',
 d:'Two restaurants in one building. The dining room takes reservations and serves tasting menus; the front Tavern takes none and serves à la carte.',
 f:['ok|Tavern: no res'],
 tip:'Walk into the Tavern room at 17:30 and put your name down. Same kitchen, no booking, half the ceremony.'},

{s:'eat',t:['Bookable','American'],n:'Union Square Cafe',h:'Union Square',a:'101 E 19th St',lat:40.7370,lng:-73.9880,
 o:'Lunch and dinner daily',
 d:'Danny Meyer\u2019s first restaurant, 1985, and the template for how New York does gracious. Bar seats, a market-driven menu, no attitude.'},

{s:'eat',t:['Walk in','Steak','Historic'],n:'Keens Steakhouse',h:'Midtown South',a:'72 W 36th St',lat:40.7501,lng:-73.9856,
 o:'Lunch weekdays, dinner nightly',
 d:'Open since 1885, with 50,000 clay churchwarden pipes on the ceiling belonging to members past. The mutton chop is the order — nobody else in America still serves one.',
 f:['ok|Pub room walk-in'],
 tip:'The dining rooms need booking. The pub room takes walk-ins, serves the same mutton chop, and has a better whisky list.'},

{s:'eat',t:['Bookable','Burger','Historic'],n:'Minetta Tavern',h:'Greenwich Village',a:'113 MacDougal St',lat:40.7295,lng:-74.0002,
 o:'Dinner nightly; weekend lunch',
 d:'A 1937 bar with caricatures on the walls and the Black Label Burger — dry-aged beef, caramelised onions, and a price that still shocks people.'},

{s:'eat',t:['Walk in','French','Burger'],n:'Raoul\u2019s',h:'SoHo',a:'180 Prince St',lat:40.7262,lng:-74.0012,
 o:'Dinner nightly, late',
 d:'A 1975 French bistro with a fortune teller\u2019s tarot booth upstairs and steak au poivre downstairs. The burger is only served at the bar and only a dozen or so a night.',
 f:['ok|Bar walk-in'],
 tip:'Get to the bar when doors open if you want the burger. It sells out fast and they will not save one.'},

{s:'eat',t:['Bookable','Italian'],n:'L\u2019Artusi',h:'West Village',a:'228 W 10th St',lat:40.7345,lng:-74.0060,
 o:'Dinner nightly',
 d:'Two floors of confident modern Italian — the ricotta, the olive-oil cake, the pastas — and one of the better Italian wine lists downtown.'},

{s:'eat',t:['Bookable','Small plates'],n:'Estela',h:'Nolita',a:'47 E Houston St',lat:40.7247,lng:-73.9945,
 o:'Dinner nightly',
 d:'Up a narrow staircase: beef tartare with sunflower seeds, endive with walnuts and ubriaco rosso, burrata with salsa verde. Small, loud, exceptional.'},

{s:'eat',t:['Walk in','Italian','Institution'],n:'Via Carota',h:'West Village',a:'51 Grove St',lat:40.7332,lng:-74.0027,
 o:'Lunch and dinner daily',
 d:'Jody Williams and Rita Sodi\u2019s rustic Italian: the svizzerina, cacio e pepe, and an insalata verde with a following of its own.',
 f:['ok|No reservations'],
 tip:'No bookings, ever. Put your name in, then wait across the street at Bar Pisellino with a negroni sbagliato. Expect 60–90 minutes on a Saturday.'},

{s:'eat',t:['Walk in','Italian'],n:'I Sodi',h:'West Village',a:'314 Bleecker St',lat:40.7331,lng:-74.0044,
 o:'Dinner nightly',
 d:'Rita Sodi\u2019s Florentine kitchen — lasagna of twenty paper-thin layers, carciofi alla giudia, and the best negroni in the city, by fairly wide agreement.',
 f:['warn|Hard booking'],
 tip:'Reservations are difficult; the bar seats are walk-in and turn over. Go at 17:30.'},

{s:'eat',t:['Walk in','Deli','Institution'],n:'Katz\u2019s Delicatessen',h:'Lower East Side',a:'205 E Houston St',lat:40.7223,lng:-73.9874,
 o:'Daily; open very late Friday and Saturday',
 d:'Since 1888. Hand-carved pastrami on rye with mustard, a pickle, and no negotiation. Also the <i>When Harry Met Sally</i> table, which is signposted.',
 f:['ok|No reservations','cash|Keep your ticket'],
 tip:'Take a ticket at the door and do not lose it. Go to the carving counter, not the table service — tip the carver a couple of dollars and he will hand you a warm sample while he works.'},

{s:'eat',t:['Walk in','Deli','Institution'],n:'Russ & Daughters',h:'Lower East Side',a:'179 E Houston St (shop) / 127 Orchard St (cafe)',lat:40.7226,lng:-73.9880,
 o:'Shop from 08:00 daily; cafe from 09:00',
 d:'An appetizing store since 1914 — smoked salmon, sable, whitefish, and the four kinds of cured fish New York quietly runs on. The Orchard Street cafe sits you down for it.',
 f:['ok|No reservations'],
 tip:'The shop counter is for takeaway and is faster. Take a bagel with Gaspé Nova and a black coffee to a bench on Houston.'},

{s:'eat',t:['Walk in','Pizza','Cheap'],n:'Joe\u2019s Pizza',h:'Greenwich Village',a:'7 Carmine St',lat:40.7304,lng:-74.0026,

function secOverview(){
 return `
<p class="eyebrow">Card 1 of 9 · Orientation</p>
<h1><span class="bul"></span>Below&nbsp;59th</h1>
<p class="sub">Three days in the half of Manhattan that starts at the harbour and stops at Central Park South. Roughly nine square miles, fifteen neighbourhoods, and everything within them walkable if you are willing to walk.</p>

<div class="grid">
  <div class="stat"><span class="k">Dates</span><span class="v">Fri 4 – Sun 6 Sep</span><span class="n">Labor Day falls on Monday 7 September, so this is the long weekend\u2019s first three days.</span></div>

  <div class="stat"><span class="k">Weather, typically</span><span class="v">26°C / 79°F</span><span class="n">Early-September average high; nights around 19°C / 66°F. Humid, with afternoon thunderstorms possible. Peak Atlantic hurricane season — check the forecast three days out.</span></div>
  <div class="stat"><span class="k">Daylight</span><span class="v">06:25 – 19:17</span><span class="n">Sunset is around 19:15 all weekend. That is your window for rooftops, the Brooklyn Bridge and Grand Banks.</span></div>
</div>

<h2>What makes this particular weekend different <em>Read this before you book anything</em></h2>
<p class="lede">Three things shape it, and none of them are in Lower Manhattan.</p>
<div class="panel rule" style="--c:var(--line-red)">
<h3>1. The US Open is on</h3>
<p>The tournament runs 30 August to 13 September, and your Friday, Saturday and Sunday are the third and fourth rounds. It is in Queens, but it lifts hotel rates across midtown and fills the 7 train. If you want to go, Sunday has the best draw.</p>
<h3>2. It is a holiday weekend, but Monday is the holiday</h3>
<p>Friday and Saturday behave like a normal busy weekend. Sunday is the getaway day, which means the city empties slightly and restaurant tables loosen. Museums stay open on Labor Day itself; the subway drops to a Sunday schedule on the Monday if you fly out then.</p>
<h3>3. New York\u2019s autumn season starts the week after you leave</h3>
<p>Broadway Week, Fashion Week, the Chelsea gallery openings and the Feast of San Gennaro all begin between 8 and 17 September. That is a real gap — see <span class="jumpref" data-go="weekend">This Weekend</span> for what is genuinely on, and what is not.</p>
</div>

<h2>How the island is put together</h2>
<p>Below 14th Street the streets are named and crooked, because they predate the 1811 grid. Above 14th they are numbered and rigid. That single fact explains most of Manhattan: downtown you get lost and it is pleasant, midtown you never get lost and it is not.</p>
<p>Avenues run north–south and are long; streets run east–west and are short. Twenty numbered streets make roughly one mile. Fifth Avenue divides east addresses from west. The grid is rotated about 29° off true north, which is why "west" always feels like you are also walking uphill on the map.</p>
<p>Rule of thumb for the whole trip: <b>1 avenue block ≈ 4 minutes on foot. 1 street block ≈ 1 minute.</b> If a walk is under twenty minutes, walk it — it will beat the subway once you count the stairs.</p>

<h2>Where to point yourself</h2>
<p>If you have three days and no fixed agenda, the natural shape is one day downtown (harbour, Financial District, Chinatown, Lower East Side), one day on the west side (High Line, Whitney, Meatpacking, West Village), and one day in midtown (Grand Central, MoMA, a deck, a theatre). <span class="jumpref" data-go="plan">Three Days</span> lays that out hour by hour.</p>

<div class="panel dark">
<h3>Before you go further</h3>
<p>Opening hours, exhibition runs and event dates move. Everything here was checked in late August 2026, but confirm anything you are building a day around — especially museum hours over the holiday, the Washington Square art fair\u2019s exact dates, and any restaurant you are travelling for.</p>
</div>`;
}

<div class="panel rule" style="--c:var(--line-orange)">
<h3>How reservations actually work here</h3>
<p>Almost everything runs on <b>Resy</b> or <b>OpenTable</b>. Restaurants release tables on a fixed schedule — most commonly 30 days ahead at exactly 10:00 New York time, though the window ranges from 13 to 60 days. If you are not refreshing at 09:59:50 on the drop date, you are picking through what is left.</p>
<p>Three things that work when the drop does not: <b>set a Resy Notify</b> and accept an odd hour; <b>go to the bar</b>, where most hard restaurants seat walk-ins with the full menu; and <b>eat at 17:30 or 21:45</b>, which are the two times nobody wants and every restaurant has.</p>
<p>Sunday of a holiday weekend is the softest night of the three. If there is one table you are travelling for, aim it at Sunday.</p>

<tr><td>Our Flag Was Still There</td><td>9/11 Memorial Museum</td><td>28 Feb</td></tr>
</table>`;
 return out;
}

function secPlan(){
 return `
<p class="eyebrow">Card 8 of 9 · A workable shape</p>
<h1><span class="bul"></span>Three Days</h1>
<p class="sub">One version of the weekend that does not require a car, a tour or a schedule you will abandon by 11:00. Each day is one broad geography, so the walking stays short and the transitions make sense.</p>

<div class="panel rule" style="--c:var(--line-lime)">
<h3>Friday — downtown, harbour to Houston</h3>
<p><b>08:00</b> &nbsp;Bagel and coffee at Russ &amp; Daughters on Houston Street, eaten on a bench.<br>
<b>09:00</b> &nbsp;Subway to Bowling Green. Charging Bull before the crowds, then Trinity Church and the graveyard, then Wall Street.<br>
<b>10:30</b> &nbsp;The 9/11 Memorial plaza, then the museum (timed ticket). Allow two hours; it is heavier than you expect.<br>
<b>13:00</b> &nbsp;Walk through the Oculus, north into Tribeca. Lunch at Frenchette or a slice, whichever mood you are in.<br>
<b>14:30</b> &nbsp;Staten Island Ferry, round trip, free, one hour, the Statue of Liberty from the deck.<br>
<b>16:00</b> &nbsp;Chinatown on foot: Doyers Street, Columbus Park, an egg tart on Mott.<br>
<b>17:00</b> &nbsp;Optional — Little Island for the free Bon Appétit session at 17:00, or straight to the Lower East Side.<br>
<b>19:30</b> &nbsp;Dinner in the Lower East Side or the East Village. <b>22:00</b> Attaboy or Double Chicken Please.</p>
</div>

<div class="panel rule" style="--c:var(--line-lime)">
<h3>Saturday — the west side, river to river</h3>
<p><b>08:30</b> &nbsp;The High Line from Gansevoort Street, before the crowds arrive. Forty minutes to 23rd Street.<br>
<b>10:00</b> &nbsp;Whitney Museum — Biennial, Warhol, and the new Lichtenstein show opening today. Two hours.<br>
<b>12:30</b> &nbsp;Lunch at Chelsea Market — Los Tacos No. 1, standing up.<br>
<b>13:30</b> &nbsp;Walk south into the West Village. Bedford, Grove, Commerce, Barrow. No destination.<br>
<b>15:00</b> &nbsp;Washington Square Park, then east to the outdoor art exhibit on University Place (until 18:00).<br>
<b>17:00</b> &nbsp;Put your name in at Via Carota, drink at Bar Pisellino while you wait. Or Grand Banks at Pier 25 for oysters and sunset at 19:15.<br>
<b>20:30</b> &nbsp;Ginsberg at 100 at Little Island, or a 20:00 set at the Village Vanguard, or a Broadway curtain.</p>
</div>

<div class="panel rule" style="--c:var(--line-lime)">
<h3>Sunday — midtown, and up</h3>
<p><b>09:00</b> &nbsp;MoMA at opening. Go to the fifth floor first and work down; by noon it is unmanageable.<br>
<b>11:30</b> &nbsp;Walk east to St Patrick\u2019s, then Rockefeller Center, then Grand Central. Look at the ceiling; try the Whispering Gallery.<br>
<b>13:00</b> &nbsp;Lunch at the Grand Central dining concourse, or Urban Hawker if you want the best food in midtown.<br>
<b>14:30</b> &nbsp;Choose one: the Morgan Library (quiet, extraordinary), the Roosevelt Island tram (four minutes, cheap, brilliant), or the US Open fourth round if you have tickets.<br>
<b>17:30</b> &nbsp;Bryant Park chairs, or Koreatown\u2019s one block for an early barbecue.<br>
<b>19:00</b> &nbsp;Top of the Rock, booked for the sunset slot — the Empire State Building in front, the park behind.<br>
<b>21:00</b> &nbsp;Sunday is the loosest restaurant night of the weekend. This is when to try for the table you could not get.</p>
</div>

<h2>If it rains</h2>
<p>September thunderstorms in New York arrive fast and end fast — usually an hour. If one lands: the Morgan Library, the Tenement Museum, the Museum of Chinese in America, Grand Central\u2019s concourse and the Oculus are all indoors and all worth the hour. The subway is a rain shelter with trains in it.</p>

<h2>If you only have one afternoon</h2>
<p>Get off at 14th Street. Walk the High Line north for twenty minutes, come down, walk south into the West Village, get lost for an hour, and eat at whatever has a queue outside. That is the most Manhattan afternoon available below 59th Street.</p>`;
}

function secPractical(){
 return `
<p class="eyebrow">Card 9 of 9 · The mechanics</p>
<h1><span class="bul"></span>Practical</h1>
<p class="sub">Transit, money, timing and the small conventions that make the difference between visiting New York and moving through it.</p>

<h2>Getting around</h2>
<table>
<tr><th>Mode</th><th>How it works</th></tr>
<tr><td>Subway</td><td>Tap a contactless card or phone at the turnstile — OMNY. No ticket needed. The fare caps after twelve rides in seven days, so a weekly pass is pointless for a weekend. Runs 24 hours; late-night waits can be 15–20 minutes. Downtown, the 1/2/3, 4/5/6, A/C/E and N/Q/R all run north–south; the L is the only real cross-town line below 42nd.</td></tr>
<tr><td>Walking</td><td>Your default. Twenty numbered streets to a mile. Below 14th Street the grid gives up and you should too.</td></tr>
<tr><td>Citi Bike</td><td>Day pass through the app. The Hudson River greenway is flat, protected and the best ride in the city. E-bikes cost extra per minute.</td></tr>
<tr><td>Taxi &amp; rideshare</td><td>Yellow cabs are hailed on the street and are often faster to get than an app car in midtown. Both are slow at 17:00–19:00 and after theatres let out.</td></tr>
<tr><td>Ferries</td><td>NYC Ferry runs from Wall Street, Pier 11 and West 39th. Cheap, scenic, and the East River route beats the subway for Brooklyn.</td></tr>
<tr><td>Airports</td><td>JFK: AirTrain to Jamaica, then LIRR to Penn (35–50 min). LGA: Q70 bus to the E/F/M/R, or a cab. EWR: NJ Transit to Penn Station.</td></tr>
</table>

<h2>Money and conventions</h2>
<div class="grid">
 <div class="stat"><span class="k">Tipping</span><span class="v">18–20%</span><span class="n">Restaurants and bars. $1–2 a drink at a bar. Card readers suggest 20/25/30% — you are not obliged to take the default.</span></div>
 <div class="stat"><span class="k">Sales tax</span><span class="v">8.875%</span><span class="n">Added at the till, not shown on the price. Clothing and shoes under $110 are exempt.</span></div>
 <div class="stat"><span class="k">Cash</span><span class="v">Rarely needed</span><span class="n">Except McSorley\u2019s, some Chinatown counters and a few dive bars. Carry $40 for those.</span></div>
 <div class="stat"><span class="k">Drinking age</span><span class="v">21, enforced</span><span class="n">Bring a passport. Photocopies and expired IDs are refused.</span></div>
</div>

<h2>Holiday weekend specifics</h2>
<p><b>Friday and Saturday</b> run normally. Museums, shops and restaurants keep standard hours; the city is busy.</p>
<p><b>Sunday</b> is the quietest of your three days — many people have left town, restaurant tables loosen, and the Financial District is close to empty.</p>
<p><b>Monday 7 September</b> is Labor Day itself. Museums and most shops stay open. Banks, post offices and public offices close. The subway runs a Sunday schedule, so allow extra time if you are travelling that day. Federal Hall and other National Park Service offices may be shut.</p>
<p>Some downtown lunch spots that serve office workers close entirely Saturday and Sunday. If you are in the Financial District at midday on a weekend, walk to the Seaport or Tribeca.</p>

<h2>Small things that help</h2>
<p><b>Stand right, walk left</b> on escalators, and never stop at the top of a subway stair.</p>
<p><b>Public toilets are scarce.</b> Reliable ones: Bryant Park, the Oculus, Whole Foods, hotel lobbies, and any museum you have paid to enter.</p>
<p><b>Water is free and good.</b> New York tap water is famously soft; carry a bottle and refill it.</p>
<p><b>Book museum tickets online.</b> Same price, no queue, and several now require timed entry.</p>
<p><b>September is humid.</b> Linen, comfortable shoes and a compact umbrella. Air conditioning indoors is aggressive — bring a layer.</p>

<h2>Useful links</h2>
<div class="links" style="font-size:14px">
 <a href="https://www.nyctourism.com/" target="_blank" rel="noopener">NYC Tourism</a>
 <a href="https://www.mta.info/" target="_blank" rel="noopener">MTA subway status</a>
 <a href="https://www.timeout.com/newyork" target="_blank" rel="noopener">Time Out New York</a>
 <a href="https://www.theinfatuation.com/new-york" target="_blank" rel="noopener">The Infatuation</a>
 <a href="https://resy.com/cities/ny" target="_blank" rel="noopener">Resy</a>
 <a href="https://www.tdf.org/tkts/" target="_blank" rel="noopener">TKTS</a>
 <a href="https://www.nycgovparks.org/" target="_blank" rel="noopener">NYC Parks events</a>
</div>`;
}

const BUILD={overview:secOverview,hoods:secHoods,see:secSee,eat:secEat,drink:secDrink,weekend:secWeekend,map:secMap,plan:secPlan,practical:secPractical};

/* =======================================================================
   BOOT
   ======================================================================= */
const nav=document.getElementById('nav'), rail=document.getElementById('rail'), main=document.getElementById('main');

SECTIONS.forEach(s=>{
  const b=document.createElement('button');
  b.style.setProperty('--c',LINES[s.c]); b.dataset.c=s.c; b.dataset.go=s.id;
  b.innerHTML='<span class="bul">'+s.glyph+'</span>'+s.nav;
  b.addEventListener('click',()=>go(s.id));
  nav.appendChild(b);

  const sec=document.createElement('section');
  sec.className='card'; sec.id='sec-'+s.id; sec.dataset.sec=s.id; sec.style.setProperty('--c',LINES[s.c]);
  sec.innerHTML=BUILD[s.id]();
  main.appendChild(sec);
});
main.insertAdjacentHTML('beforeend',
 '<footer>South of the Park &nbsp;·&nbsp; a guide to Manhattan below 59th Street for 4–6 September 2026 &nbsp;·&nbsp; '
 +'compiled 26 August 2026 &nbsp;·&nbsp; hours, dates and exhibition runs change — confirm anything you are planning a day around.</footer>');

/* filters */
function buildFilters(sec){
  const wrap=document.querySelector('.chips[data-filter="'+sec+'"]'); if(!wrap) return;
  const items=P.filter(p=>p.s===sec);
  const tags=[...new Set(items.flatMap(p=>p.t))];
  let active=null;
  const draw=()=>{
    const shown=active?items.filter(p=>p.t.includes(active)):items;
    document.getElementById('list-'+sec).innerHTML=listFor(sec,SECTIONS.find(s=>s.id===sec).c,shown);
    document.getElementById('count-'+sec).textContent=
      shown.length+' of '+items.length+' shown'+(active?' · '+active:'');
    wrap.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.tag===active)));
  };
  const all=document.createElement('button');
  all.className='chip'; all.textContent='All'; all.dataset.tag='';
  all.addEventListener('click',()=>{active=null;draw();});
  wrap.appendChild(all);
  tags.forEach(t=>{
    const c=document.createElement('button');
    c.className='chip'; c.textContent=t; c.dataset.tag=t; c.setAttribute('aria-pressed','false');
    c.addEventListener('click',()=>{active=(active===t?null:t);draw();});
    wrap.appendChild(c);
  });
  draw();
  wrap.querySelector('.chip').setAttribute('aria-pressed','false');
}
['see','eat','drink'].forEach(buildFilters);

/* internal jump links */
document.addEventListener('click',e=>{
  const j=e.target.closest('.jumpref'); if(j) go(j.dataset.go);
});
document.querySelectorAll('.jumpref').forEach(s=>{
  s.classList.add('jump'); s.setAttribute('role','button'); s.setAttribute('tabindex','0');
  s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(s.dataset.go);}});
});

/* routing */
function go(id){
  const s=SECTIONS.find(x=>x.id===id)||SECTIONS[0];
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.dataset.sec===s.id));
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===s.id)));
  rail.style.setProperty('--c',LINES[s.c]);
  try{ if(location.hash.slice(1)!==s.id) history.replaceState(null,'','#'+s.id); }catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
  document.title='South of the Park — '+s.nav;
  if(s.id==='map') drawMap();
}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'overview');

/* =======================================================================
   MAP DRAWING
   ======================================================================= */
let mapDrawn=false, mapOff=new Set();
function drawMap(){
  if(mapDrawn){return;} mapDrawn=true;
  const svg=document.getElementById('svgmap');
  const NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

  svg.appendChild(el('rect',{x:0,y:0,width:SVGW,height:SVGH,fill:'var(--water)'}));
  [NJ,BKQ,ROOS].forEach(g=>svg.appendChild(el('path',{d:path(g),fill:'var(--land)'})));
  svg.appendChild(el('path',{d:path(NORTHOF),fill:'#c3cbc1'}));
  svg.appendChild(el('path',{d:path(MANHATTAN),fill:'#fbfbf9',stroke:'#12161c','stroke-width':1.6,'stroke-linejoin':'round'}));

  /* the 1811 grid, at its true 29° rotation, clipped to the part of the island that has one */
  const defs=el('defs',{});
  const clip=el('clipPath',{id:'gridzone'});
  clip.appendChild(el('path',{d:path(GRIDZONE)}));
  defs.appendChild(clip); svg.appendChild(defs);

  const th=29*Math.PI/180, cx=SVGW/2, cy=SVGH/2, R=1500;
  const ux=Math.sin(th), uy=-Math.cos(th);   // avenues run about N29°E
  const vx=Math.cos(th), vy=Math.sin(th);    // streets run perpendicular
  const grid=el('g',{'clip-path':'url(#gridzone)',stroke:'#12161c'});
  for(let i=-40;i<=40;i++){                  // avenues, ~280 m apart
    const px=cx+i*28*vx, py=cy+i*28*vy;
    grid.appendChild(el('line',{'stroke-width':.9,opacity:.16,
      x1:px-ux*R,y1:py-uy*R,x2:px+ux*R,y2:py+uy*R}));
  }
  for(let i=-40;i<=40;i++){                  // every fifth cross street
    const px=cx+i*40*ux, py=cy+i*40*uy;
    grid.appendChild(el('line',{'stroke-width':.5,opacity:.1,
      x1:px-vx*R,y1:py-vy*R,x2:px+vx*R,y2:py+vy*R}));
  }
  svg.appendChild(grid);
  svg.appendChild(el('path',{d:path(MANHATTAN),fill:'none',stroke:'#12161c','stroke-width':1.8,'stroke-linejoin':'round'}));

  /* 59th St boundary */
  const bl=el('path',{d:'M '+X(-73.9928).toFixed(1)+' '+Y(40.7742).toFixed(1)
    +' L '+X(-73.9819).toFixed(1)+' '+Y(40.7681).toFixed(1)
    +' L '+X(-73.9732).toFixed(1)+' '+Y(40.7644).toFixed(1)
    +' L '+X(-73.9583).toFixed(1)+' '+Y(40.7580).toFixed(1),
    fill:'none',stroke:'#b933ad','stroke-width':3,'stroke-linecap':'round'});
  svg.appendChild(bl);
  const bt=el('text',{x:X(-73.9800),y:Y(40.7716),'font-size':10.5,'letter-spacing':1.6,
    fill:'#b933ad','font-weight':700,'text-anchor':'middle'});
  bt.textContent='59TH ST — GUIDE BOUNDARY'; svg.appendChild(bt);

  /* water labels */
  [['HUDSON RIVER',40.7380,-74.0235,-70],['EAST RIVER',40.7340,-73.9645,-62],
   ['UPPER BAY',40.6990,-74.0300,0]].forEach(([t,la,ln,rot])=>{
    const e=el('text',{x:X(ln),y:Y(la),'font-size':11,'letter-spacing':2.2,fill:'#7d8b95',
      'font-weight':700,transform:'rotate('+rot+' '+X(ln)+' '+Y(la)+')'});
    e.textContent=t; svg.appendChild(e);
  });
  [['NEW JERSEY',40.7500,-74.0305,'start'],['BROOKLYN',40.7020,-73.9450,'end'],
   ['QUEENS',40.7560,-73.9450,'end']].forEach(([t,la,ln,anch])=>{
    const e=el('text',{x:X(ln),y:Y(la),'font-size':10.5,'letter-spacing':1.8,fill:'#8f978d',
      'font-weight':700,'text-anchor':anch});
    e.textContent=t; svg.appendChild(e);
  });

  /* markers */
  const layer=el('g',{});
  svg.appendChild(layer);

  /* neighbourhood labels sit above the markers, haloed, and ignore clicks */
  const labels=el('g',{});
  MAPLABELS.forEach(([t,la,ln])=>{
    const e=el('text',{class:'hood-label',x:X(ln),y:Y(la),'font-size':9.6,'letter-spacing':1.5,
      fill:'#4a525d','font-weight':700,'text-anchor':'middle'});
    e.textContent=t; labels.appendChild(e);
  });
  svg.appendChild(labels);
  const info=document.getElementById('mapinfo');

  function paint(){
    layer.innerHTML='';
    P.forEach(p=>{
      if(mapOff.has(p.s)) return;
      const gm=el('g',{class:'mk',tabindex:0,role:'button'});
      gm.appendChild(el('circle',{cx:X(p.lng),cy:Y(p.lat),r:5.4,fill:MAPCATS[p.s].k}));
      const title=el('title',{}); title.textContent=p.n; gm.appendChild(title);
      const show=()=>{
        info.innerHTML='<span class="nm">'+p.n+'</span>'
         +'<p class="meta"><span class="hood">'+p.h+'</span>'+(p.a?' · '+p.a:'')+(p.o?'<br>'+p.o:'')+'</p>'
         +'<p style="margin:0 0 8px">'+p.d+'</p>'
         +'<div class="links"><a href="'+gmap(p)+'" target="_blank" rel="noopener" style="--c:'+MAPCATS[p.s].k+';border-color:'+MAPCATS[p.s].k+'">Open in Google Maps</a></div>';
      };
      gm.addEventListener('click',show);
      gm.addEventListener('focus',show);
      gm.addEventListener('keydown',e=>{if(e.key==='Enter')show();});
      layer.appendChild(gm);
    });
  }
  paint();

  /* legend */
  const lg=document.getElementById('legend');
  Object.entries(MAPCATS).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='lg'; b.style.setProperty('--k',v.k); b.setAttribute('aria-pressed','true');
    b.innerHTML='<i></i>'+v.l+' ('+P.filter(p=>p.s===k).length+')';
    b.addEventListener('click',()=>{
      if(mapOff.has(k)){mapOff.delete(k);b.setAttribute('aria-pressed','true');}
      else{mapOff.add(k);b.setAttribute('aria-pressed','false');}
      paint();
    });
    lg.appendChild(b);
  });
}
</script>
