<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camptown Weekend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --mist:#edefec;
  --panel:#fbfbf8;
  --ink:#262220;
  --ink2:#4d4743;
  --muted:#6f6862;
  --rule:#d3d1c9;
  --gilt:#a68431;
  --gilt-soft:#e9dfc2;
  --wine:#7d2232;
  --wine-ink:#fbf6f2;
  --river:#3e5c6e;
  --moss:#52603d;
  --water:#c9d6dc;
  --land:#f6f6f2;
  --hill:#dfe2d6;
  --display:"IM Fell English","Iowan Old Style",Georgia,serif;
  --display-sc:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --mist:#15161a;--panel:#1e1f24;--ink:#ece6dc;--ink2:#cbc3b8;--muted:#9a928a;
    --rule:#34343b;--gilt:#d2b065;--gilt-soft:#3a3324;--wine:#e2808f;--wine-ink:#1a1214;
    --river:#93b6c9;--moss:#a9bb8a;--water:#1b2a33;--land:#22242a;--hill:#2a2e2a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --mist:#15161a;--panel:#1e1f24;--ink:#ece6dc;--ink2:#cbc3b8;--muted:#9a928a;
  --rule:#34343b;--gilt:#d2b065;--gilt-soft:#3a3324;--wine:#e2808f;--wine-ink:#1a1214;
  --river:#93b6c9;--moss:#a9bb8a;--water:#1b2a33;--land:#22242a;--hill:#2a2e2a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--mist)}
.brand{max-width:1080px;margin:0 auto;padding:10px 16px 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.brand b{font-family:var(--display);font-style:italic;font-weight:400;font-size:22px;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:11.5px;opacity:.7}
nav{max-width:1080px;margin:0 auto;padding:0 8px;display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;cursor:pointer;color:inherit;opacity:.66;font-family:var(--display-sc);font-size:16px;letter-spacing:.04em;padding:9px 11px 8px;border-bottom:3px solid transparent}
nav button:hover{opacity:1}
nav button[aria-current="true"]{opacity:1;border-bottom-color:var(--gilt)}
nav button:focus-visible{outline:2px solid var(--gilt);outline-offset:-2px}

main{max-width:1080px;margin:0 auto;padding:0 16px 72px}
.card{padding-top:26px}

/* ---------- gilt-frame wall label ---------- */
.label{background:var(--panel);border:1px solid var(--gilt);outline:1px solid var(--gilt);outline-offset:4px;margin:6px 5px 26px;padding:20px 22px 16px;display:grid;gap:4px}
.label .room{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gilt)}
.label h1{margin:0;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1.04;text-wrap:balance}
.label .medium{font-family:var(--display);font-size:18px;color:var(--ink2)}
.label .steps{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);margin-top:10px;padding-top:9px}
.label .steps button{background:none;border:0;padding:0;cursor:pointer;font-family:var(--display-sc);font-size:15px;color:var(--wine)}
.label .steps button:hover{text-decoration:underline}
.label .steps button:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.lede{font-size:20px;line-height:1.5;color:var(--ink2);max-width:62ch;margin:0 0 22px}

h2{font-family:var(--display-sc);font-weight:400;font-size:22px;letter-spacing:.03em;margin:40px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--gilt);text-wrap:balance}
p{margin:0 0 12px;max-width:68ch}

.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fact{background:var(--panel);border:1px solid var(--rule);padding:13px 15px}
.fact .k{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact .v{display:block;font-family:var(--display);font-size:25px;line-height:1.15;margin:3px 0 5px}
.fact .n{display:block;font-size:15.5px;color:var(--ink2);line-height:1.45}
.note{background:var(--panel);border:1px solid var(--rule);border-top:3px double var(--gilt);padding:14px 18px;margin:18px 0;max-width:840px}
.note p:last-child{margin-bottom:0}

/* ---------- item cards ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 8px}
.chip{border:1px solid var(--rule);background:var(--panel);cursor:pointer;font-family:var(--display-sc);font-size:15px;padding:4px 12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--mist);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:0 0 12px}
.items{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.item{background:var(--panel);border:1px solid var(--rule);padding:15px 17px;display:flex;flex-direction:column;gap:7px}
.item.cia{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.seal{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--wine);color:var(--wine-ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px}
.seal.alum{background:transparent;color:var(--wine);border:1px solid var(--wine)}
.item .nm{font-family:var(--display);font-size:24px;line-height:1.15}
.item .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.55}
.item .meta b{color:var(--ink);font-weight:500}
.item .d{margin:0;font-size:16.5px;line-height:1.5}
.item .chef{margin:0;font-size:15.5px;color:var(--ink2);font-style:italic}
.item .tip{margin:0;font-size:15.5px;color:var(--ink2);border-top:1px dotted var(--rule);padding-top:7px}
.item .tip b{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);margin-right:5px}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border:1px solid currentColor;color:var(--river)}
.flag.warn{color:var(--wine)}
.flag.ok{color:var(--moss)}
.item .links{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:14px;font-family:var(--display-sc);font-size:15px}
.item .links a,.item .links button{background:none;border:0;padding:0;cursor:pointer;text-decoration:none;border-bottom:1px solid var(--gilt);color:var(--ink)}
.item .links a:hover,.item .links button:hover{color:var(--wine)}
.item .links button:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;min-width:520px;background:var(--panel);font-size:16px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-family:var(--display);font-size:18px;white-space:nowrap}
td.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- weekend board ---------- */
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.day{background:var(--panel);border:1px solid var(--rule)}
.day header{padding:10px 14px 8px;border-bottom:1px solid var(--gilt);display:flex;justify-content:space-between;align-items:baseline}
.day header b{font-family:var(--display);font-style:italic;font-weight:400;font-size:26px}
.day header span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day ul{list-style:none;margin:0;padding:4px 14px 12px}
.day li{padding:7px 0;border-bottom:1px dotted var(--rule);font-size:15.5px;line-height:1.4}
.day li:last-child{border-bottom:0}
.day li .t{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- plan ---------- */
.plan{display:grid;gap:14px}
.dayplan{background:var(--panel);border:1px solid var(--rule);padding:16px 18px;display:grid;grid-template-columns:150px 1fr;gap:6px 22px}
.dayplan .when b{display:block;font-family:var(--display);font-style:italic;font-weight:400;font-size:30px;line-height:1.05}
.dayplan .when span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dayplan dl{margin:0;display:grid;grid-template-columns:64px 1fr;gap:7px 12px;font-size:16.5px}
.dayplan dt{font-family:var(--mono);font-size:12px;color:var(--wine);padding-top:4px;font-variant-numeric:tabular-nums}
.dayplan dd{margin:0}
@media (max-width:600px){.dayplan{grid-template-columns:1fr}}

/* ---------- map ---------- */
.mapwrap{background:var(--panel);border:1px solid var(--rule);padding:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lg{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);background:none;cursor:pointer;padding:4px 11px;font-family:var(--display-sc);font-size:15px}
.lg i{width:11px;height:11px;border-radius:50%;display:block;background:var(--k)}
.lg[aria-pressed="false"]{opacity:.4}
.lg:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
#svgmap{display:block;width:100%;height:auto;max-width:100%}
#svgmap text{pointer-events:none}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:hover circle,.mk:focus circle{stroke:var(--ink);stroke-width:2.5}
#mapinfo{border-top:1px solid var(--gilt);margin-top:10px;padding-top:10px;min-height:76px;font-size:16px}
#mapinfo .nm{font-family:var(--display);font-size:22px}
#mapinfo .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:2px 0 6px}
#mapinfo a{font-family:var(--display-sc);text-decoration:none;border-bottom:1px solid var(--gilt)}

.jump{background:none;border:0;padding:0;cursor:pointer;font-family:var(--display-sc);font-size:1em;color:var(--wine);border-bottom:1px solid var(--gilt)}
.jump:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
footer{max-width:1080px;margin:0 auto;padding:18px 16px 32px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@media (max-width:520px){body{font-size:17px}.lede{font-size:18px}.items{grid-template-columns:1fr}.label{padding:16px 16px 14px}}
</style>
</head>

const BODY={
overview:()=>`
<p class="lede">Three days based at Camptown, between the Hudson and the Catskill escarpment, in the landscape the Hudson River School painted. Everything here is chosen for two people: candlelit dinners, short walks with long views, and evenings that end early enough to enjoy the cabin.</p>
<div class="facts">
 <div class="fact"><span class="k">Dates</span><span class="v">Fri 30 Oct – Sun 1 Nov</span><span class="n">Halloween is Saturday, and the clocks go back early Sunday morning.</span></div>
 <div class="fact"><span class="k">Base</span><span class="v">Camptown, Leeds</span><span class="n">Rooms and log cabins, with Casa Susanna on site. Catskill is 8 minutes away and Hudson 15.</span></div>
 <div class="fact"><span class="k">Weather, typically</span><span class="v">58°F / 38°F</span><span class="n">Typical late-October high and low. Frost is likely overnight; bring layers and something warm for the evenings.</span></div>
 <div class="fact"><span class="k">Daylight</span><span class="v">7:25 – 5:52</span><span class="n">Friday and Saturday. On Sunday, after the time change, it's about 6:27 to 4:50.</span></div>
</div>
<div class="note"><p><b>Highlighting CIA kitchens.</b> The Culinary Institute of America is an hour south in Hyde Park, and its graduates cook all over this valley. Five of the ten tables carry a seal. Only one fits "young and recently graduated" exactly: <b>Steffan Bailey (class of 2020) at Kingston Nord</b>. Phōs and Isola are run by 2012 graduates, Gracie's founders met at the CIA, and American Bounty is cooked by current students. See <button class="jump" data-go="eat">Tables for Two</button>.</p></div>
<h2>How the weekend fits together</h2>
<p>The Hudson runs north to south through the middle of everything. Leeds and Catskill sit on the west bank where Catskill Creek comes down from the mountains. Hudson, Olana and Kinderhook are across the Rip Van Winkle Bridge on the east bank. The escarpment rises steeply to the west: Kaaterskill Clove and Tannersville are a 20–30 minute climb.</p>
<p>Late October is quieter than leaf-peeping weekends. Color hangs on in the valley oaks and maples while the higher slopes are mostly bare, which opens up views that are hidden in summer. Several seasonal places close this weekend or just after, and Olana's main tour season ends Sunday, so plan those first.</p>
<h2>If you only do three things</h2>
<p>Dinner at Casa Susanna on Friday without leaving the property. The Olana house and landscape tour on Saturday morning, then sunset on the Skywalk. Sunday brunch at Kingston Nord, with a walk at Poets' Walk on the way home. <button class="jump" data-go="plan">Our Weekend</button> fills in the rest.</p>`,

eat:()=>`<p class="lede">Ten tables, chosen for atmosphere as much as food. Gold-framed cards are CIA kitchens; the solid seal marks the recent graduate and the student-run room.</p>
<div class="note"><p><b>About the CIA picks.</b> I searched the CIA's alumni news through 2025 and 2026 and regional food press for young chefs who graduated recently. Only Kingston Nord's Steffan Bailey (class of 2020, restaurant opened summer 2026) fits closely. The other three CIA kitchens are run by more established graduates, and their class years are on each card. I didn't include CIA alumni whose year I couldn't confirm.</p></div>
<div class="note"><p><b>Reservations.</b> Book Saturday dinner now: it's Halloween, and Hudson in particular will be busy. Most places use Resy; Isola, Phōs and Kingston Nord are easiest by phone. Tip 20%. At American Bounty, the students can't accept tips.</p></div>
<div class="chips" data-f="eat"></div><p class="count" id="count-eat"></p><div class="items" id="list-eat"></div>`,

walks:()=>`<p class="lede">Five short walks, none longer than a couple of hours. With sunset before 6 on Saturday and before 5 on Sunday, start by mid-afternoon.</p><div class="items">`

<div class="note"><p><b>Late-October trail sense.</b> Wet leaves hide roots and slick the rock. Wear boots, carry a headlamp even on short walks, and note that it is still hunting season in the state forests, so bright colors help.</p></div>`,

plan:()=>`<p class="lede">One way to spend the weekend, built around the light and the reservations. Every evening ends close to the cabin.</p>
<div class="plan">
 <div class="dayplan"><div class="when"><b>Friday</b><span>30 Oct · arrive</span></div><dl>
  <dt>Lunch</dt><dd>If you're driving up from the south, stop for lunch at American Bounty at the CIA (11:30–1, book on OpenTable), then continue an hour north.</dd>
  <dt>3:30</dt><dd>Check in, then take the short walk to the Kaaterskill Falls viewing platform. Be back down before the 5:53 sunset.</dd>
  <dt>7:00</dt><dd>Dinner at Casa Susanna on site. Or, for a night out: Phōs in Catskill at 6, then PHENOM at Bridge Street Theatre next door.</dd></dl></div>
 <div class="dayplan"><div class="when"><b>Saturday</b><span>31 Oct · Halloween</span></div><dl>
  <dt>9:00</dt><dd>Doughnuts and coffee at Gracie's, a five-minute walk from Camptown.</dd>
  <dt>10:00</dt><dd>Olana house and landscape tour, booked ahead (2 hours, $45).</dd>
  <dt>1:00</dt><dd>Lunch on Warren Street in Hudson. Stay for the costume parade at 4:05 if it appeals, or leave before the crowds build.</dd>
  <dt>5:15</dt><dd>Walk out onto the Rip Van Winkle Bridge on the Skywalk for sunset at 5:52.</dd>
  <dt>7:30</dt><dd>Dinner at Deer Mountain Inn, up the mountain, by candlelight. Or Serre in Hudson if you'd rather not drive the Clove at night.</dd></dl></div>
 <div class="dayplan"><div class="when"><b>Sunday</b><span>1 Nov · an extra hour</span></div><dl>
  <dt>2:00 am</dt><dd>Clocks go back. Sleep in.</dd>
  <dt>11:00</dt><dd>Brunch at Kingston Nord with Chef Steffan Bailey, CIA class of 2020: smørrebrød, latkes with beet-cured salmon, an aquavit Bloody Mary.</dd>
  <dt>1:00</dt><dd>Walk the Stockade District's stone houses, then cross the Kingston–Rhinecliff Bridge to Poets' Walk for the gazebo view.</dd>
  <dt>3:30</dt><dd>Head home before the 4:50 sunset, or stop at Opus 40 on the way if you're heading back through Saugerties.</dd></dl></div>
</div>
<h2>If it rains</h2>
<p>Stay in the cabin longer, then go to the Thomas Cole house and its exhibitions, the magic show at Bridge Street Theatre, and a long lunch at Phōs. Warren Street's antiques shops are good for a wet afternoon. Skip the falls trail, which turns slick in rain.</p>`,

practical:()=>`<p class="lede">Getting here, getting around, and the few things that catch people out on this weekend.</p>
<h2>Getting there</h2>
<div class="tablewrap"><table><thead><tr><th>From</th><th>How</th></tr></thead><tbody>
<tr><td>New York City</td><td>About 2½ hours by car up the NYS Thruway (I-87) to Exit 21 (Catskill), then 5 minutes to Leeds.</td></tr>
<tr><td>By train</td><td>Amtrak from Penn Station to Hudson, about 2 hours. Camptown is about 15 minutes away by taxi across the Rip Van Winkle Bridge. Book a car ahead; rideshares are scarce.</td></tr>
<tr><td>Albany airport</td><td>About 45 minutes south by car.</td></tr>
</tbody></table></div>
<h2>Drive times from Camptown</h2>
<div class="tablewrap"><table><thead><tr><th>To</th><th>About</th><th>For</th></tr></thead><tbody>
<tr><td>Catskill</td><td class="num">8 min</td><td>Phōs, Thomas Cole, Bridge Street Theatre</td></tr>
<tr><td>Hudson</td><td class="num">15 min</td><td>Warren Street, Serre, Via Cassia, Pez</td></tr>
<tr><td>Olana</td><td class="num">12 min</td><td>Tours, carriage roads</td></tr>
<tr><td>Kaaterskill Falls</td><td class="num">25 min</td><td>Laurel House Road lot</td></tr>
<tr><td>Tannersville</td><td class="num">30 min</td><td>Deer Mountain Inn</td></tr>
<tr><td>Saugerties</td><td class="num">25 min</td><td>Opus 40, lighthouse</td></tr>
<tr><td>Kinderhook</td><td class="num">30 min</td><td>Isola</td></tr>
<tr><td>Kingston</td><td class="num">35 min</td><td>Kingston Nord, Stockade</td></tr>
<tr><td>Hyde Park (CIA)</td><td class="num">55 min</td><td>American Bounty</td></tr>
</tbody></table></div>
<h2>Things that catch people out</h2>
<p><b>The time change.</b> Clocks go back at 2 am Sunday. Phones adjust automatically; a car clock or travel alarm may not.</p>
<p><b>Night driving.</b> Route 23A through Kaaterskill Clove is narrow and twisting, with deer on the road after dark. Allow extra time.</p>
<p><b>Halloween in Hudson.</b> Warren Street is crowded and parking is scarce Saturday afternoon. Arrive before 1 or after 6.</p>
<p><b>Cell service.</b> It fades in the Clove and on the mountaintop. Download offline maps before you go.</p>
<p><b>Seasonal closures.</b> Many small places close Tuesday and Wednesday, which won't affect a Friday–Sunday trip. Sunday is the gap: Isola and American Bounty are closed.</p>
<h2>Sources</h2>
<p style="font-size:15.5px">Camptown (camptowncatskills.com); CIA Alumni in the News, May 2025 and Apr & Jun 2026 (ciachef.edu); Chronogram on Kingston Nord, Phōs, Pez and Gracie's; venue sites for Thomas Cole, Olana, Opus 40, Deer Mountain Inn, The Maker and Kingston Nord; hudsonhalloween.com; catskillcrew.com; Great Northern Catskills; nyfalls.com.</p>`

CARDS.forEach((c,i)=>{
 const b=document.createElement('button');b.textContent=c.nav;b.dataset.go=c.id;nav.appendChild(b);
 const s=document.createElement('section');s.className='card';s.dataset.card=c.id;s.hidden=true;

function filters(sec){
 const wrap=document.querySelector('.chips[data-f="'+sec+'"]'),items=P.filter(p=>p.s===sec);
 const tags=[...new Set(items.flatMap(p=>p.t))];let act=null;
 const draw=()=>{const sh=act?items.filter(p=>p.t.includes(act)):items;
  $('#list-'+sec).innerHTML=sh.map(item).join('');
  $('#count-'+sec).textContent=sh.length+' of '+items.length+' shown'+(act?' · '+act:'');
  wrap.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String((c.dataset.t||null)===act)));};
 ['All',...tags].forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;
  if(t!=='All')c.dataset.t=t;c.addEventListener('click',()=>{act=(t==='All'||act===t)?null:t;draw();});wrap.appendChild(c);});
 draw();
}
filters('see');filters('eat');

function go(id,pin){
 const c=CARDS.find(x=>x.id===id)||CARDS[0];
 document.querySelectorAll('.card').forEach(s=>s.hidden=s.dataset.card!==c.id);
 nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===c.id)));
 try{if(location.hash.slice(1)!==c.id)history.replaceState(null,'','#'+c.id)}catch(e){}
 window.scrollTo(0,0);
 if(c.id==='map'){drawMap();if(pin!=null)showPin(+pin);}
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const p=e.target.closest('[data-pin]');if(p)go('map',p.dataset.pin);
});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));

const B={lat0:41.915,lat1:42.425,lng0:-74.160,lng1:-73.660};
const K=Math.cos(42.17*Math.PI/180),W=720,H=Math.round(W*(B.lat1-B.lat0)/((B.lng1-B.lng0)*K));
const X=l=>(l-B.lng0)/(B.lng1-B.lng0)*W, Y=l=>(B.lat1-l)/(B.lat1-B.lat0)*H;
const RIVER=[[42.425,-73.784],[42.38,-73.790],[42.33,-73.800],[42.29,-73.805],[42.26,-73.802],[42.24,-73.820],[42.225,-73.845],[42.212,-73.857],[42.18,-73.875],[42.14,-73.895],[42.10,-73.915],[42.07,-73.928],[42.03,-73.935],[41.99,-73.945],[41.95,-73.958],[41.915,-73.966]];
const CREEK=[[42.262,-73.930],[42.255,-73.905],[42.252,-73.893],[42.240,-73.885],[42.225,-73.875],[42.215,-73.865],[42.212,-73.858]];
const HILLS=[[42.330,-74.160],[42.310,-74.060],[42.270,-74.010],[42.220,-74.000],[42.180,-74.010],[42.130,-74.030],[42.080,-74.050],[42.030,-74.080],[41.980,-74.120],[41.960,-74.160]];
const CAT={home:{k:'var(--ink)',l:'Camptown'},see:{k:'var(--river)',l:'Sights'},eat:{k:'var(--wine)',l:'Tables'},walk:{k:'var(--moss)',l:'Walks'}};
const LBL=[['LEEDS',42.240,-73.915,'end'],['CATSKILL',42.205,-73.880,'end'],['HUDSON',42.262,-73.775,'start'],['ATHENS',42.275,-73.822,'end'],['SAUGERTIES',42.085,-73.955,'end'],['KINGSTON',41.945,-74.035,'end'],['KINDERHOOK',42.408,-73.708,'end'],['TANNERSVILLE',42.182,-74.120,'middle'],['GERMANTOWN',42.135,-73.880,'start'],['RED HOOK',41.995,-73.890,'start']];
let drawn=false;const off=new Set();
const pts=a=>a.map(p=>X(p[1]).toFixed(1)+','+Y(p[0]).toFixed(1)).join(' ');
function drawMap(){
 if(drawn)return;drawn=true;
 const svg=$('#svgmap'),NS='http://www.w3.org/2000/svg';
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 const el=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
 svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'var(--land)'}));
 svg.appendChild(el('polygon',{points:pts(HILLS)+' 0,'+H+' 0,0',fill:'var(--hill)'}));
 svg.appendChild(el('text',{x:X(-74.135),y:Y(42.24),'font-family':'IM Fell English SC, Georgia, serif','font-size':17,fill:'var(--muted)',transform:'rotate(-72 '+X(-74.135)+' '+Y(42.24)+')'},'Catskill Escarpment'));
 svg.appendChild(el('polyline',{points:pts(RIVER),fill:'none',stroke:'var(--water)','stroke-width':16,'stroke-linecap':'round','stroke-linejoin':'round'}));
 svg.appendChild(el('polyline',{points:pts(CREEK),fill:'none',stroke:'var(--water)','stroke-width':4,'stroke-linecap':'round'}));
 svg.appendChild(el('text',{x:X(-73.905),y:Y(42.02),'font-family':'IM Fell English, Georgia, serif','font-style':'italic','font-size':18,fill:'var(--river)',transform:'rotate(-75 '+X(-73.905)+' '+Y(42.02)+')'},'Hudson River'));
 svg.appendChild(el('line',{x1:X(-73.862),y1:Y(42.226),x2:X(-73.832),y2:Y(42.220),stroke:'var(--muted)','stroke-width':2,'stroke-dasharray':'3 3'}));
 const lab=el('g',{});
 LBL.forEach(([t,la,ln,an])=>lab.appendChild(el('text',{x:X(ln),y:Y(la),'text-anchor':an,'font-family':'IBM Plex Mono, monospace','font-size':10.5,'letter-spacing':1.5,fill:'var(--muted)'},t)));
 svg.appendChild(lab);
 const layer=el('g',{});svg.appendChild(layer);
 window.paint=()=>{layer.innerHTML='';P.forEach((p,i)=>{
  if(p.off||off.has(p.s))return;
  const g=el('g',{class:'mk',tabindex:0,role:'button','aria-label':p.n,'data-i':i});
  const x=X(p.lng),y=Y(p.lat);
  if(p.s==='home'){
   g.appendChild(el('circle',{cx:x,cy:y,r:10,fill:'var(--ink)',stroke:'var(--gilt)','stroke-width':3}));
   g.appendChild(el('text',{x:x,y:y-16,'text-anchor':'middle','font-family':'IM Fell English, Georgia, serif','font-style':'italic','font-size':17,fill:'var(--ink)'},'Camptown'));
  } else g.appendChild(el('circle',{cx:x,cy:y,r:6.5,fill:CAT[p.s].k,stroke:'var(--panel)','stroke-width':2}));
  g.addEventListener('click',()=>showPin(i));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showPin(i);}});
  layer.appendChild(g);});};
 paint();
 const lg=$('#legend');
 Object.entries(CAT).forEach(([k,v])=>{const b=document.createElement('button');b.className='lg';b.setAttribute('aria-pressed','true');
  b.innerHTML='<i style="--k:'+v.k+'"></i>'+v.l;
  b.addEventListener('click',()=>{off.has(k)?off.delete(k):off.add(k);b.setAttribute('aria-pressed',String(!off.has(k)));paint();});lg.appendChild(b);});
}
function showPin(i){
 const p=P[i];
 $('#mapinfo').innerHTML='<div class="nm">'+p.n+'</div><div class="meta">'+p.h+(p.o?' · '+p.o:'')+(p.stats?' · '+p.stats:'')+'</div>'
  +(p.cia?'<p style="margin:0 0 4px;color:var(--wine);font-family:var(--mono);font-size:12px">'+p.cia+'</p>':'')
  +'<p style="margin:0 0 6px">'+p.d+'</p><a href="'+gmap(p)+'" target="_blank" rel="noopener">Open in Google Maps</a>';
}
go(location.hash.slice(1)||'overview');
</script>
</body>
</html>
